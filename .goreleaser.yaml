version: 2

project_name: agenthub

before:
  hooks:
    - go mod tidy

builds:
  - id: ah
    main: ./cmd/ah
    binary: ah
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: agenthub-server
    main: ./cmd/agenthub-server
    binary: agenthub-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

# Archive names carry no version so get.sh can use releases/latest/download/<name>.
archives:
  - id: agenthub
    ids: [ah, agenthub-server]
    name_template: "agenthub_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }}"
  abbrev: 7
  filters:
    exclude: ["^wip", "^Merge", "(?i)typo"]
  groups:
    - title: Features
      regexp: '(?i)^(add|make|replace|turn|default)'
      order: 0
    - title: Fixes
      regexp: '(?i)^(fix|dashboard: fix)'
      order: 1
    - title: Other
      order: 99

release:
  prerelease: auto
  name_template: "AgentHub {{ .Tag }}"
  header: |
    ## AgentHub {{ .Tag }}

    A local blackboard for AI coding agents: one Go binary plus SQLite, with a dashboard at http://localhost:8080.

    ### Install

    macOS / Linux:
    ```sh
    curl -fsSL https://raw.githubusercontent.com/its-ammu/agenthub/main/get.sh | sh -s -- --version {{ .Tag }}
    ```

    Windows (PowerShell):
    ```powershell
    $env:AGENTHUB_VERSION = "{{ .Tag }}"; irm https://raw.githubusercontent.com/its-ammu/agenthub/main/get.ps1 | iex
    ```

    Or download the archive for your OS and CPU below and verify it against `checksums.txt`
    (`shasum -a 256 -c checksums.txt --ignore-missing`).
  footer: |
    {{ if .PreviousTag }}---
    Full changelog: https://github.com/its-ammu/agenthub/compare/{{ .PreviousTag }}...{{ .Tag }}{{ end }}
